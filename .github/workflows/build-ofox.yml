name: Build OrangeFox 12.1 — Xiaomi myron

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox branch'
        required: true
        default: '12.1'
        type: choice
        options: ['12.1', '11.0']
      DEVICE_TREE:
        description: 'URL repo device tree'
        required: true
        default: 'https://github.com/hackpupg001-a11y/android_device_xiaomi_myron'
      DEVICE_TREE_BRANCH:
        description: 'Branch device tree'
        required: true
        default: 'ofox-12.1'
      DEVICE_PATH:
        description: 'Device path (relative to workspace)'
        required: true
        default: 'device/xiaomi/myron'
      DEVICE_NAME:
        description: 'Codename'
        required: true
        default: 'myron'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options: ['recovery', 'boot', 'vendorboot']
      UPLOAD_RELEASE:
        description: 'Upload to GitHub Release?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: 🦊 OrangeFox — myron (SD8 Elite)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Ho_Chi_Minh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Maximize disk & RAM ───────────────────────────
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Check disk & RAM
        run: |
          df -h
          free -h

      # ─── Dependencies ──────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 \
            openjdk-11-jdk schedtool \
            libssl-dev bc rsync ccache \
            pngcrush imagemagick lz4

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      # ─── Sync OrangeFox source ─────────────────────────
      - name: Clone OrangeFox sync script
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git /tmp/ofox_sync --depth=1

      - name: Sync OrangeFox ${{ github.event.inputs.MANIFEST_BRANCH }}
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          cd /tmp/ofox_sync
          bash orangefox_sync.sh \
            --branch ${{ github.event.inputs.MANIFEST_BRANCH }} \
            --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        timeout-minutes: 90

      # ─── Device tree ───────────────────────────────────
      - name: Clone device tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone \
            --depth=1 \
            --branch ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ${{ github.event.inputs.DEVICE_TREE }} \
            ./${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git -C ./${{ github.event.inputs.DEVICE_PATH }} rev-parse HEAD)" >> $GITHUB_ENV

      # ─── ccache ────────────────────────────────────────
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ofox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          restore-keys: |
            ccache-ofox-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          ccache -M 10G
          ccache -z
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ─── Build ─────────────────────────────────────────
      - name: Build OrangeFox Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_THEME=portrait_hdpi
          export TARGET_SCREEN_WIDTH=1080
          export TARGET_SCREEN_HEIGHT=2400
          echo "=== envsetup ==="
          . build/envsetup.sh 2>&1
          echo "=== lunch ==="
          lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng 2>&1
          echo "=== make clean ==="
          make clean 2>&1
          echo "=== build ==="
          mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j4 2>&1 | tee build.log
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        timeout-minutes: 180
        shell: bash

      - name: ccache stats
        if: always()
        run: ccache -s

      # ─── Find output ───────────────────────────────────
      - name: Find output files
        id: find_output
        run: |
          BASE=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          OUT=$BASE/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
          echo "FILE_PATH=$OUT" >> $GITHUB_ENV

          IMG=$(find $OUT -maxdepth 1 -name "OrangeFox*.img" 2>/dev/null | head -1)
          ZIP=$(find $OUT -maxdepth 1 -name "OrangeFox*.zip" 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            IMG=$(find $OUT -maxdepth 1 -name "recovery.img" 2>/dev/null | head -1)
          fi

          echo "img=$IMG" >> $GITHUB_OUTPUT
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "=== Output files ==="
          ls -lh $OUT/*.img $OUT/*.zip 2>/dev/null || echo "No img/zip found"

      # ─── Upload artifacts ──────────────────────────────
      - name: Upload recovery.img
        if: steps.find_output.outputs.img != ''
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-img-${{ github.run_number }}
          path: ${{ steps.find_output.outputs.img }}
          retention-days: 7

      - name: Upload OrangeFox zip
        if: steps.find_output.outputs.zip != ''
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-zip-${{ github.run_number }}
          path: ${{ steps.find_output.outputs.zip }}
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ github.workspace }}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log
          if-no-files-found: warn
          retention-days: 3

      # ─── GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        if: github.event.inputs.UPLOAD_RELEASE == 'true' && steps.find_output.outputs.img != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-myron-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: "🦊 OrangeFox 12.1 | myron | ${{ env.BUILD_DATE }}"
          prerelease: true
          body: |
            ## 🦊 OrangeFox Recovery 12.1 — Xiaomi myron

            | | |
            |---|---|
            | **Device** | Xiaomi myron (K90 Pro Max) |
            | **Chip** | Snapdragon 8 Elite (sm8850) |
            | **Build date** | ${{ env.BUILD_DATE }} |
            | **OFox branch** | ${{ github.event.inputs.MANIFEST_BRANCH }} |
            | **Commit** | ${{ env.COMMIT_ID }} |

            ### Flash
            ```
            fastboot flash recovery OrangeFox-*.img
            fastboot reboot recovery
            ```
            > ⚠️ Backup trước khi flash!
          files: |
            ${{ steps.find_output.outputs.img }}
            ${{ steps.find_output.outputs.zip }}
          token: ${{ secrets.GITHUB_TOKEN }}
