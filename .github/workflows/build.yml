name: OrangeFox 14.1 — Xiaomi myron (SM8850)

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: "Device tree URL"
        required: true
        default: "https://github.com/hackpupg001-a11y/android_device_xiaomi_myron"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "fox_14.1"
      DEVICE_PATH:
        description: "Device path (relative to device/)"
        required: true
        default: "xiaomi/myron"
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "myron"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}

    steps:

    # ── 1. Disk / RAM preparation ──────────────────────────────────────────────
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 8192
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: 5G
        create-symlink: true
        key: ofox-myron-${{ github.run_id }}
        restore-keys: ofox-myron-

    # ── 2. Host packages ───────────────────────────────────────────────────────
    - name: Install build dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev libc6-dev-i386 libelf-dev libgl1-mesa-dev libncurses5 \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush python3 python3-pip rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev repo lz4
        git config --global user.name  "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git config --global color.ui   false

    # ── 3. Sync OrangeFox 14.1 source ─────────────────────────────────────────
    - name: Sync OrangeFox 14.1 manifest
      run: |
        mkdir -p ~/ofox && cd ~/ofox
        repo init \
          -u https://gitlab.com/OrangeFox/sync.git \
          -b 14.1 \
          --depth=1 \
          --git-lfs
        # keep runner alive while syncing
        (while true; do echo "$(date +%T) still syncing..."; sleep 60; done) &
        PING=$!
        repo sync -j$(nproc) \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --prune
        kill $PING || true

    # ── 4. Clone device tree ───────────────────────────────────────────────────
    - name: Clone device tree
      run: |
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          ~/ofox/device/${{ github.event.inputs.DEVICE_PATH }}

    # ── 5. Optional patches ────────────────────────────────────────────────────
    - name: Apply device patches
      run: |
        PATCH_DIR=~/ofox/device/${{ github.event.inputs.DEVICE_PATH }}/patches
        if [ -d "$PATCH_DIR" ] && ls "$PATCH_DIR"/*.patch &>/dev/null; then
          cd ~/ofox/bootable/recovery
          for p in "$PATCH_DIR"/*.patch; do
            echo "Applying: $p"
            git apply "$p" && echo "OK" || echo "SKIP (may already be applied)"
          done
        else
          echo "No patches — skipping"
        fi

    # ── 6. Build ───────────────────────────────────────────────────────────────
    - name: Build OrangeFox recovery
      run: |
        cd ~/ofox

        export LC_ALL=C
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_DUP_RULES=true
        export BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES=true
        export FOX_BUILD_DEVICE="${{ github.event.inputs.DEVICE_NAME }}"

        # ccache
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)
        export CCACHE_DIR=~/.ccache
        export CCACHE_COMPRESS=1
        export CCACHE_MAXSIZE=5G

        source build/envsetup.sh

        # lunch — OrangeFox 14.1 dùng ap2a-eng variant
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng

        # keepalive
        (while true; do
          echo "$(date +%T) | RAM: $(free -h | awk '/^Mem/{print $3"/"$2}') | DISK: $(df -h ~ | awk 'NR==2{print $3"/"$2}')"
          sleep 30
        done) &
        PING=$!

        mka adbd recoveryimage 2>&1 | tee /tmp/build.log
        STATUS=${PIPESTATUS[0]}
        kill $PING || true

        if [ $STATUS -ne 0 ]; then
          echo ""
          echo "══════════════ BUILD FAILED — last 100 lines ══════════════"
          tail -100 /tmp/build.log
          exit 1
        fi

    # ── 7. Collect outputs ─────────────────────────────────────────────────────
    - name: Collect build artifacts
      run: |
        cd ~/ofox
        OUT=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        DATE=$(date +%Y%m%d)
        TAG="OrangeFox-14.1-${{ github.event.inputs.DEVICE_NAME }}-${DATE}"

        echo "BUILD_DATE=${DATE}" >> $GITHUB_ENV
        echo "RELEASE_TAG=${TAG}"  >> $GITHUB_ENV

        ls -lh "$OUT"/*.img "$OUT"/*.zip 2>/dev/null || true

        # Rename img
        if [ -f "$OUT/recovery.img" ]; then
          mv "$OUT/recovery.img" "$OUT/${TAG}.img"
          echo "IMG_PATH=$OUT/${TAG}.img" >> $GITHUB_ENV
        fi

        # Rename zip (OrangeFox installer)
        ZIP=$(ls "$OUT"/OrangeFox*.zip 2>/dev/null | head -1)
        if [ -n "$ZIP" ]; then
          mv "$ZIP" "$OUT/${TAG}.zip"
          echo "ZIP_PATH=$OUT/${TAG}.zip" >> $GITHUB_ENV
        fi

    # ── 8. Upload build log on failure ────────────────────────────────────────
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: /tmp/build.log
        retention-days: 7

    # ── 9. Release ─────────────────────────────────────────────────────────────
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ~/ofox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ~/ofox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: ${{ env.RELEASE_TAG }}
        tag_name: ${{ env.RELEASE_TAG }}
        body: |
          OrangeFox 14.1 for Xiaomi myron (POCO F8 Ultra / Redmi K90 Pro Max)
          
          **SoC**: Snapdragon 8 Elite (SM8850)
          **Branch**: fox_14.1 / Android 16 SDK 36
          **Build date**: ${{ env.BUILD_DATE }}
          **Tree**: ${{ github.event.inputs.DEVICE_TREE_URL }}@${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          **Run**: ${{ github.run_id }}
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
