name: Build IQ từ Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Dán link Google Drive của file ZIP source (phải bật Ai có liên kết cũng xem được)"
        required: true
        type: string
      new_password:
        description: "Mật khẩu login mới (để trống = giữ nguyên mật khẩu trong source)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64 + Obfuscar
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Lấy repository chứa workflow
        uses: actions/checkout@v6

      - name: Cài Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cài gdown
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdown==6.1.0"

      - name: Tải source từ Google Drive
        shell: pwsh
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $downloadPath = Join-Path $env:RUNNER_TEMP "IQ_source.zip"
          if (Test-Path $downloadPath) {
            Remove-Item $downloadPath -Force
          }

          Write-Host "Đang tải source từ Google Drive..."

          # gdown 6.x đã bỏ tùy chọn --fuzzy và tự nhận diện ID từ link chia sẻ Drive.
          # Dùng python -m gdown để không phụ thuộc PATH của script gdown.exe.
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Lần tải $attempt/3..."
            python -m gdown "$env:DRIVE_URL" -O "$downloadPath"

            if ($LASTEXITCODE -eq 0 -and (Test-Path $downloadPath)) {
              $downloaded = $true
              break
            }

            if (Test-Path $downloadPath) {
              Remove-Item $downloadPath -Force -ErrorAction SilentlyContinue
            }

            if ($attempt -lt 3) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $downloaded) {
            throw "Không tải được file từ Google Drive. Kiểm tra link là link FILE ZIP và quyền chia sẻ là: Ai có liên kết cũng xem được."
          }

          if (-not (Test-Path $downloadPath)) {
            throw "Không tìm thấy file ZIP sau khi tải."
          }

          $fileInfo = Get-Item $downloadPath
          if ($fileInfo.Length -lt 1024) {
            throw "File tải về quá nhỏ ($($fileInfo.Length) byte), có thể link Drive chưa công khai hoặc không phải file ZIP."
          }

          $stream = [System.IO.File]::OpenRead($downloadPath)
          try {
            $b1 = $stream.ReadByte()
            $b2 = $stream.ReadByte()
          }
          finally {
            $stream.Dispose()
          }

          if ($b1 -ne 0x50 -or $b2 -ne 0x4B) {
            throw "File tải về không có chữ ký ZIP (PK). Hãy tải đúng file .zip, không dán link thư mục Drive."
          }

          Write-Host "Tải xong: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          "SOURCE_ZIP=$downloadPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Giải nén và tìm IQ.sln
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $extractPath = Join-Path $env:GITHUB_WORKSPACE "source"
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractPath | Out-Null

          Expand-Archive -Path "$env:SOURCE_ZIP" -DestinationPath $extractPath -Force

          $solutions = @(Get-ChildItem -Path $extractPath -Filter "IQ.sln" -File -Recurse)
          if ($solutions.Count -eq 0) {
            throw "Không tìm thấy IQ.sln trong file ZIP."
          }
          if ($solutions.Count -gt 1) {
            Write-Warning "Có nhiều IQ.sln; workflow sẽ dùng file đầu tiên: $($solutions[0].FullName)"
          }

          $solution = $solutions[0]
          $projectRoot = Split-Path -Parent $solution.FullName
          $projectFile = Join-Path $projectRoot "IQ.csproj"
          $cryptoCoreProject = Join-Path $projectRoot "CryptoCore\CryptoCore.vcxproj"

          if (-not (Test-Path $projectFile)) {
            throw "Đã tìm thấy IQ.sln nhưng thiếu IQ.csproj tại: $projectRoot"
          }
          if (-not (Test-Path $cryptoCoreProject)) {
            throw "Đã tìm thấy IQ.sln nhưng thiếu CryptoCore\CryptoCore.vcxproj tại: $projectRoot (cần để build CryptoCore.dll native)."
          }

          Write-Host "Solution: $($solution.FullName)"
          Write-Host "Project root: $projectRoot"

          "SOLUTION_PATH=$($solution.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Đổi mật khẩu login (nếu có nhập)
        if: ${{ inputs.new_password != '' }}
        shell: pwsh
        env:
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: |
          $ErrorActionPreference = "Stop"

          $script = Join-Path $env:PROJECT_ROOT "tools\Set-LoginPassword.ps1"
          if (-not (Test-Path $script)) {
            throw "Không tìm thấy tools\Set-LoginPassword.ps1 trong source; không thể đổi mật khẩu."
          }

          Write-Host "Đang cập nhật mật khẩu login vào CryptoCore.cpp..."

          # Set-LoginPassword.ps1 là script PowerShell (không phải .exe) nên không set $LASTEXITCODE;
          # script này tự throw khi lỗi, nên chỉ cần để lỗi đó nổi lên (ErrorActionPreference = Stop).
          & $script -Password $env:NEW_PASSWORD

          Write-Host "Đã cập nhật mật khẩu login. CryptoCore.dll mới sẽ được build ở bước sau."

      - name: Thêm MSBuild Visual Studio 2022 vào PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cài NuGet.exe
        uses: NuGet/setup-nuget@v3
        with:
          nuget-version: latest

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~\.nuget\packages
          key: nuget-windows-iq-${{ hashFiles('source/**/IQ.csproj', 'source/**/NuGet.config') }}
          restore-keys: |
            nuget-windows-iq-

      - name: Kiểm tra cấu hình project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectFile = Join-Path $env:PROJECT_ROOT "IQ.csproj"
          [xml]$projectXml = Get-Content -LiteralPath $projectFile
          $framework = $projectXml.Project.PropertyGroup.TargetFrameworkVersion | Where-Object { $_ } | Select-Object -First 1

          Write-Host "Target Framework: $framework"
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          if (-not (Test-Path (Join-Path $env:PROJECT_ROOT "Templates\DF.xlsx"))) {
            throw "Thiếu Templates\DF.xlsx trong source."
          }

          $cryptoCoreProject = Join-Path $env:PROJECT_ROOT "CryptoCore\CryptoCore.vcxproj"
          if (-not (Test-Path $cryptoCoreProject)) {
            throw "Thiếu CryptoCore\CryptoCore.vcxproj trong source."
          }
          $toolset = Select-String -Path $cryptoCoreProject -Pattern "<PlatformToolset>(.*)</PlatformToolset>" | Select-Object -First 1
          if ($toolset) {
            Write-Host "CryptoCore PlatformToolset: $($toolset.Matches[0].Groups[1].Value)"
          }

      - name: Restore NuGet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:PROJECT_ROOT
          try {
            msbuild "IQ.sln" `
              /t:Restore `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:RestoreIgnoreFailedSources=false `
              /m `
              /v:minimal

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore thất bại với mã lỗi $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Build Release x64 (CryptoCore native + IQ.exe + Obfuscar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binlog = Join-Path $env:RUNNER_TEMP "IQ-build.binlog"

          Push-Location $env:PROJECT_ROOT
          try {
            # IQ.sln build cả 2 project: CryptoCore (C++ native, v143) trước, rồi IQ.csproj (C#).
            # IQ.csproj có target MSBuild riêng tự gọi CryptoCore.vcxproj nếu build lẻ,
            # nhưng build qua .sln đảm bảo đúng thứ tự dependency khai báo trong IQ.sln.
            msbuild "IQ.sln" `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /m `
              /v:minimal `
              "/bl:$binlog"

            if ($LASTEXITCODE -ne 0) {
              throw "Build thất bại với mã lỗi $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          "BUILD_BINLOG=$binlog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Kiểm tra và đóng gói bản chạy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = Join-Path $env:PROJECT_ROOT "bin\x64\Release"
          $mainExe = Join-Path $releaseDir "IQ.exe"
          $obfuscatedExe = Join-Path $releaseDir "obfuscated\IQ.exe"
          $cryptoDll = Join-Path $releaseDir "CryptoCore.dll"

          if (-not (Test-Path $mainExe)) {
            throw "Build xong nhưng không tìm thấy: $mainExe"
          }

          # CryptoCore.dll phải được copy vào bin\x64\Release bởi target CopyCryptoCoreDll trong IQ.csproj.
          # Nếu thiếu, IQ.exe sẽ không chạy được trên máy đích (DllNotFoundException khi login).
          if (-not (Test-Path $cryptoDll)) {
            throw "Build xong nhưng thiếu CryptoCore.dll tại: $cryptoDll. Kiểm tra log build CryptoCore.vcxproj (project C++ có thể build lỗi hoặc bị bỏ qua)."
          }

          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package"
          $packageDir = Join-Path $packageRoot "IQ-v9.9-Release-x64"
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item -Path (Join-Path $releaseDir "*") -Destination $packageDir -Recurse -Force

          # Một số phiên bản MSBuild.Obfuscar để IQ.exe đã làm rối trong thư mục obfuscated.
          # Nếu có thì ưu tiên file này và ghi đè IQ.exe trong gói cuối.
          if (Test-Path $obfuscatedExe) {
            Write-Host "Đã tìm thấy IQ.exe của Obfuscar; dùng bản đã làm rối."
            Copy-Item -LiteralPath $obfuscatedExe -Destination (Join-Path $packageDir "IQ.exe") -Force
          }
          else {
            Write-Host "Không có thư mục obfuscated riêng; dùng IQ.exe do bước MSBuild Release tạo ra."
          }

          $nestedObfuscated = Join-Path $packageDir "obfuscated"
          if (Test-Path $nestedObfuscated) {
            Remove-Item $nestedObfuscated -Recurse -Force
          }

          # Không phát hành symbol debug và file ánh xạ tên làm rối.
          Get-ChildItem -Path $packageDir -Filter "*.pdb" -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $packageDir -Filter "*.ilk" -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $packageDir -Filter "Mapping.txt" -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem -Path $packageDir -Filter "mapping.xml" -File -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

          $finalExe = Join-Path $packageDir "IQ.exe"
          $finalDll = Join-Path $packageDir "CryptoCore.dll"
          $template = Join-Path $packageDir "Templates\DF.xlsx"
          if (-not (Test-Path $finalExe)) {
            throw "Gói cuối thiếu IQ.exe."
          }
          if (-not (Test-Path $finalDll)) {
            throw "Gói cuối thiếu CryptoCore.dll."
          }
          if (-not (Test-Path $template)) {
            throw "Gói cuối thiếu Templates\DF.xlsx."
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "IQ-v9.9-Release-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = "$zipPath.sha256"
          "$hash  IQ-v9.9-Release-x64.zip" | Set-Content -Path $hashFile -Encoding ascii

          Write-Host "Đóng gói xong: $zipPath"
          Write-Host "SHA-256: $hash"

          "FINAL_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_SHA=$hashFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload bản build
        uses: actions/upload-artifact@v7
        with:
          name: IQ-v9.9-Release-x64-${{ github.run_number }}
          path: |
            ${{ env.FINAL_ZIP }}
            ${{ env.FINAL_SHA }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload binlog khi build lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: IQ-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/IQ-build.binlog
          if-no-files-found: ignore
          retention-days: 14
          
