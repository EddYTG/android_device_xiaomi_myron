name: Build mTalk Copy Unlocker v5

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NDK_VERSION: "25.2.9519653"
      BUILD_TOOLS_VERSION: "34.0.0"
      COMPILE_SDK: "34"
      DRIVE_FILE_ID: "1KLdJWFDwSpr4u0TbLLL4RGG0TkS-plLc"

    steps:

      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
              -o source.zip
          else
            curl -fsSL \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o source.zip
          fi
          echo "Downloaded: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      - name: Extract source
        run: |
          unzip -q source.zip
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          echo "=== Tree ==="
          find . -not -path './.git/*' -not -name 'source.zip' | sort | head -30

      - name: Patch source
        run: |
          # Android.mk: xoa Dobby neu con
          sed -i '/LOCAL_MODULE.*:=.*dobby/,/PREBUILT_STATIC_LIBRARY/d' jni/Android.mk
          sed -i '/LOCAL_STATIC_LIBRARIES.*dobby/d' jni/Android.mk
          # Application.mk: dam bao STL va allow exceptions (inline asm can)
          sed -i 's/^APP_STL[[:space:]]*:=.*/APP_STL := c++_static/' jni/Application.mk
          grep -q '^APP_STL' jni/Application.mk || echo 'APP_STL := c++_static' >> jni/Application.mk
          # Xoa -fno-exceptions vi main.cpp dung asm volatile
          sed -i 's/-fno-exceptions//' jni/Application.mk
          echo "=== Android.mk ===" && cat jni/Android.mk
          echo "=== Application.mk ===" && cat jni/Application.mk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "platforms;android-${{ env.COMPILE_SDK }}"

      - name: Download zygisk.hpp
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp" \
            -o jni/zygisk.hpp
          echo "zygisk.hpp: $(wc -c < jni/zygisk.hpp) bytes"

      - name: Build native Zygisk module
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            APP_ABI="arm64-v8a" \
            APP_OPTIM=release \
            -j$(nproc)
          find libs -name "*.so" -exec ls -lh {} \;

      - name: Compile Java payload to DEX
        run: |
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-${{ env.COMPILE_SDK }}/android.jar"
          BT="${ANDROID_SDK_ROOT}/build-tools/${{ env.BUILD_TOOLS_VERSION }}"
          mkdir -p build/classes

          # Compile ca 2 files: CopyHookEntry.java va NativeHook.java
          javac -source 11 -target 11 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            src/main/java/com/mtalk/copyhook/NativeHook.java \
            src/main/java/com/mtalk/copyhook/CopyHookEntry.java

          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --output build/ \
            $(find build/classes -name "*.class")

          mv build/classes.dex build/hook.dex
          echo "hook.dex: $(wc -c < build/hook.dex) bytes"

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Package Magisk module ZIP
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT=staging
          mkdir -p "$OUT/zygisk" "$OUT/META-INF/com/google/android"

          sed "s/^version=.*/version=${V}/" module.prop > "$OUT/module.prop"

          # arm64-v8a only — native hook ARM64 specific
          cp libs/arm64-v8a/libmtalk_copy_hook.so "$OUT/zygisk/arm64-v8a.so"

          # arm32 stub (empty, device arm64 se dung arm64-v8a)
          cp libs/arm64-v8a/libmtalk_copy_hook.so "$OUT/zygisk/armeabi-v7a.so" 2>/dev/null || \
            printf '\x7fELF' > "$OUT/zygisk/armeabi-v7a.so"

          cp build/hook.dex "$OUT/hook.dex"

          printf '#!/system/bin/sh\nui_print "mTalk Copy Unlocker v5 %s"\nchmod 644 "${0%%/*}/hook.dex"\n' \
            "$V" > "$OUT/customize.sh"

          printf '#!/system/bin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" module.prop -d "$MODPATH"\nunzip -o "$ZIPFILE" hook.dex -d "$MODPATH"\nunzip -o "$ZIPFILE" customize.sh -d "$MODPATH"\nunzip -o "$ZIPFILE" "zygisk/*" -d "$MODPATH"\nchmod 755 "$MODPATH/customize.sh"\n"$MODPATH/customize.sh"\n' \
            > "$OUT/META-INF/com/google/android/update-binary"

          echo "#MAGISK" > "$OUT/META-INF/com/google/android/updater-script"

          ZIP="mtalk_copy_hook_v5_${V}.zip"
          ( cd "$OUT" && zip -r9 "../$ZIP" . )
          echo "$(wc -c < $ZIP) bytes → $ZIP"
          unzip -l "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk_copy_hook_v5-${{ steps.ver.outputs.version }}
          path: mtalk_copy_hook_v5_*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk Copy Unlocker v5 ${{ steps.ver.outputs.version }}"
          body: |
            ## mTalk Copy Unlocker v5 ${{ steps.ver.outputs.version }}

            Hook ParagraphBuilder::addText trong libflutter.so qua /proc/self/mem.

            ### Yêu cầu
            - ARM64 device
            - Root + Magisk 24+ (Zygisk ON) hoặc KernelSU + ZygiskNext
            - mTalk v1.3.2 (Flutter 3.5.4, commit a18df97)

            ### Dùng
            - Giữ tay ~0.6s lên bất kỳ chỗ nào trong chat → Toast "Copied!"
            - Text tin nhắn đang hiển thị trên màn hình sẽ được copy

            ### Debug
            ```
            adb logcat -s mTalkCopyHook
            ```

            ### Nếu thấy "Unexpected instruction"
            Offset lệch — cần dump libflutter.so từ device để recalculate.
          files: mtalk_copy_hook_v5_*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
