name: Build ICM1000 Nuitka from Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Link chia sẻ file ZIP trên Google Drive"
        required: true
        type: string
      python_version:
        description: "Python dùng để build"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows standalone
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          architecture: x64

      - name: Install downloader and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown nuitka ordered-set zstandard

      - name: Download source ZIP from Google Drive
        shell: pwsh
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DRIVE_URL)) {
            throw "drive_url đang trống."
          }

          python -m gdown --fuzzy "$env:DRIVE_URL" --output source.zip

          if (!(Test-Path "source.zip")) {
            throw "Không tải được source.zip từ Google Drive."
          }

          $size = (Get-Item "source.zip").Length
          if ($size -lt 1000) {
            throw "File tải về quá nhỏ ($size bytes). Hãy bật Anyone with the link trên Google Drive."
          }

          New-Item -ItemType Directory -Path source -Force | Out-Null
          Expand-Archive -Path source.zip -DestinationPath source -Force

      - name: Locate project root
        shell: pwsh
        run: |
          $apps = @(Get-ChildItem -Path source -Filter app.py -File -Recurse)
          if ($apps.Count -eq 0) {
            throw "Không tìm thấy app.py trong ZIP."
          }

          $app = $apps | Sort-Object { $_.FullName.Length } | Select-Object -First 1
          $project = $app.Directory.FullName

          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_FILE=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Project root: $project"
          Write-Host "Entry file  : $($app.FullName)"

      - name: Install application dependencies
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          if (Test-Path "requirements.txt") {
            Write-Host "Installing requirements.txt"
            python -m pip install -r requirements.txt
          }
          elseif (Test-Path "requirements-build.txt") {
            Write-Host "Installing requirements-build.txt"
            python -m pip install -r requirements-build.txt
          }
          else {
            Write-Host "No requirements file found; installing fallback dependencies"
            python -m pip install Flask Flask-SocketIO eventlet cryptography requests
          }

          python -c "import flask, flask_socketio, eventlet, cryptography, requests; print('Dependency import test: OK')"

      - name: Compile with Nuitka standalone and MinGW64
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          python -m nuitka app.py `
            --standalone `
            --mingw64 `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=ICM1000_Monitor.exe `
            --include-package=flask `
            --include-package=flask_socketio `
            --include-package=socketio `
            --include-package=engineio `
            --include-package=eventlet `
            --include-package=cryptography `
            --include-package=requests `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=numpy.tests `
            --windows-console-mode=force

      - name: Copy external files into standalone folder
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"

          $exe = Get-ChildItem -Path build -Filter ICM1000_Monitor.exe -File -Recurse |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "Build hoàn tất nhưng không tìm thấy ICM1000_Monitor.exe."
          }

          $dist = $exe.Directory.FullName
          Write-Host "Standalone folder: $dist"

          foreach ($file in @(".env", "cert.pem", "key.pem", "users.json")) {
            if (Test-Path $file) {
              Copy-Item $file -Destination $dist -Force
            }
          }

          foreach ($dir in @("templates", "static", "csv_cache", "data", "config")) {
            if (Test-Path $dir) {
              Copy-Item $dir -Destination $dist -Recurse -Force
            }
          }

          Get-ChildItem -File | Where-Object {
            $_.Extension.ToLowerInvariant() -in @(".json", ".db", ".sqlite", ".ini")
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $dist -Force
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "ICM1000_Monitor_Standalone.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zipPath -CompressionLevel Optimal

          "DIST_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OUTPUT_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Output ZIP: $zipPath"
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ICM1000-Monitor-Windows-Standalone
          path: ${{ env.OUTPUT_ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
