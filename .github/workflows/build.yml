name: Build ICM1000 Main and HTTP Gateway from Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive file ID hoặc link chia sẻ ZIP"
        required: true
        type: string
      python_version:
        description: "Python dùng để build"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          architecture: x64

      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown nuitka ordered-set zstandard Flask Flask-SocketIO eventlet cryptography requests waitress

      - name: Download ZIP from Google Drive
        shell: pwsh
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          $driveInput = $env:DRIVE_URL.Trim()
          if ($driveInput -match '^[A-Za-z0-9_-]{20,}$') { $fileId = $driveInput }
          elseif ($driveInput -match '/d/([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
          elseif ($driveInput -match '[?&]id=([A-Za-z0-9_-]+)') { $fileId = $Matches[1] }
          else { throw "Không lấy được Google Drive file ID." }

          python -c "import gdown,sys; p=gdown.download(id=sys.argv[1], output='source.zip', quiet=False); raise SystemExit(0 if p else 1)" "$fileId"
          if (!(Test-Path source.zip)) { throw "Không tải được source.zip" }

          New-Item -ItemType Directory -Path source -Force | Out-Null
          Expand-Archive source.zip source -Force

      - name: Locate project
        shell: pwsh
        run: |
          $main = Get-ChildItem source -Filter app.py -File -Recurse |
            Where-Object { $_.Directory.Name -ne '__pycache__' } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if ($null -eq $main) { throw "Không tìm thấy app.py chính" }

          $project = $main.Directory.FullName
          $gateway = Join-Path $project 'gateway_app.py'
          if (!(Test-Path $gateway)) { throw "Không tìm thấy gateway_app.py" }

          "PROJECT_DIR=$project" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project: $project"

      - name: Install project requirements
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          if (Test-Path requirements-build.txt) { python -m pip install -r requirements-build.txt }
          if (Test-Path requirements-gateway.txt) { python -m pip install -r requirements-gateway.txt }

      - name: Build main HTTPS app
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m nuitka app.py `
            --standalone `
            --mingw64 `
            --assume-yes-for-downloads `
            --output-dir=build_main `
            --output-filename=ICM1000_Monitor.exe `
            --include-package=flask `
            --include-package=flask_socketio `
            --include-package=socketio `
            --include-package=engineio `
            --include-package=eventlet `
            --include-package=cryptography `
            --include-package=requests `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=numpy.tests `
            --windows-console-mode=force

      - name: Build HTTP gateway
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m nuitka gateway_app.py `
            --standalone `
            --mingw64 `
            --assume-yes-for-downloads `
            --output-dir=build_gateway `
            --output-filename=ICM1000_Client_Gateway.exe `
            --include-package=flask `
            --include-package=requests `
            --include-package=waitress `
            --nofollow-import-to=tkinter `
            --windows-console-mode=force

      - name: Package outputs
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR

          $mainExe = Get-ChildItem build_main -Filter ICM1000_Monitor.exe -File -Recurse | Select-Object -First 1
          $gatewayExe = Get-ChildItem build_gateway -Filter ICM1000_Client_Gateway.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $mainExe) { throw "Không tìm thấy main EXE" }
          if ($null -eq $gatewayExe) { throw "Không tìm thấy gateway EXE" }

          $mainDist = $mainExe.Directory.FullName
          $gatewayDist = $gatewayExe.Directory.FullName

          foreach ($file in @('.env', 'cert.pem', 'key.pem', 'users.json')) {
            if (Test-Path $file) { Copy-Item $file $mainDist -Force }
          }
          foreach ($dir in @('static', 'csv_cache', 'data', 'config')) {
            if (Test-Path $dir) { Copy-Item $dir $mainDist -Recurse -Force }
          }

          foreach ($file in @('.env', 'cert.pem')) {
            if (Test-Path $file) { Copy-Item $file $gatewayDist -Force }
          }

          $mainZip = Join-Path $env:GITHUB_WORKSPACE 'ICM1000_Main_HTTPS_Standalone.zip'
          $gatewayZip = Join-Path $env:GITHUB_WORKSPACE 'ICM1000_Client_HTTP_Gateway_Standalone.zip'
          Compress-Archive (Join-Path $mainDist '*') $mainZip -CompressionLevel Optimal
          Compress-Archive (Join-Path $gatewayDist '*') $gatewayZip -CompressionLevel Optimal

          "MAIN_ZIP=$mainZip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GATEWAY_ZIP=$gatewayZip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload main app
        uses: actions/upload-artifact@v4
        with:
          name: ICM1000-Main-HTTPS-Standalone
          path: ${{ env.MAIN_ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload client gateway
        uses: actions/upload-artifact@v4
        with:
          name: ICM1000-Client-HTTP-Gateway-Standalone
          path: ${{ env.GATEWAY_ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
