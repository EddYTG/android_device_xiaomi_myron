name: Build mTalk Copy Unlocker

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NDK_VERSION: "25.2.9519653"
      BUILD_TOOLS_VERSION: "34.0.0"
      COMPILE_SDK: "34"
      DRIVE_FILE_ID: "1Ns-grNd4lKdfrv6-0Pag4r4pVTUgt00z"

    steps:

      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o source.zip
          else
            curl -fsSL "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o source.zip
          fi
          echo "Downloaded: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      - name: Extract source
        run: |
          unzip -q source.zip
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          find . -not -path './.git/*' -not -name 'source.zip' | sort | head -30

      - name: Patch source
        run: |
          sed -i '/LOCAL_MODULE.*:=.*dobby/,/PREBUILT_STATIC_LIBRARY/d' jni/Android.mk
          sed -i '/LOCAL_STATIC_LIBRARIES.*dobby/d' jni/Android.mk
          sed -i 's/^APP_STL[[:space:]]*:=.*/APP_STL := c++_static/' jni/Application.mk
          sed -i 's/-fno-exceptions//' jni/Application.mk
          sed -i 's/-fno-rtti//' jni/Application.mk
          grep -q '^APP_STL' jni/Application.mk || echo 'APP_STL := c++_static' >> jni/Application.mk
          sed -i 's|#include.*dobby.*|#include "inline_hook.h"|' jni/main.cpp
          grep -q '<vector>'    jni/main.cpp || sed -i '/#include <jni.h>/a #include <vector>'    jni/main.cpp
          grep -q '<unistd.h>'  jni/main.cpp || sed -i '/#include <jni.h>/a #include <unistd.h>'  jni/main.cpp
          grep -q '<pthread.h>' jni/main.cpp || sed -i '/#include <jni.h>/a #include <pthread.h>' jni/main.cpp
          # Them LOCAL_C_INCLUDES vao Android.mk de tim duoc inline_hook.h
          sed -i '/^LOCAL_LDLIBS/i LOCAL_C_INCLUDES := $(LOCAL_PATH)/include' jni/Android.mk
          sed -i '/^LOCAL_LDLIBS/i LOCAL_C_INCLUDES := $(LOCAL_PATH)/include' jni/Android.mk
          cat jni/Android.mk && cat jni/Application.mk && grep '^#include' jni/main.cpp

      - name: Write inline_hook.h
        run: |
          mkdir -p jni/include
          echo "" | base64 -d > jni/include/inline_hook.h
          echo "inline_hook.h: $(wc -c < jni/include/inline_hook.h) bytes"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "platforms;android-${{ env.COMPILE_SDK }}"

      - name: Download zygisk.hpp
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp" \
            -o jni/zygisk.hpp
          echo "zygisk.hpp: $(wc -c < jni/zygisk.hpp) bytes"

      - name: Build native Zygisk module
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_OPTIM=release \
            -j$(nproc)
          find libs -name "*.so" -exec ls -lh {} \;

      - name: Compile Java payload to DEX
        run: |
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-${{ env.COMPILE_SDK }}/android.jar"
          BT="${ANDROID_SDK_ROOT}/build-tools/${{ env.BUILD_TOOLS_VERSION }}"
          mkdir -p build/classes
          javac -source 11 -target 11 -cp "$ANDROID_JAR" -d build/classes \
            src/main/java/com/mtalk/copyhook/CopyHookEntry.java
          "$BT/d8" --lib "$ANDROID_JAR" --output build/ $(find build/classes -name "*.class")
          mv build/classes.dex build/hook.dex
          echo "hook.dex: $(wc -c < build/hook.dex) bytes"

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Package Magisk module ZIP
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT=staging
          mkdir -p "$OUT/zygisk" "$OUT/META-INF/com/google/android"
          sed "s/^version=.*/version=${V}/" module.prop > "$OUT/module.prop"
          cp libs/arm64-v8a/libmtalk_copy_hook.so  "$OUT/zygisk/arm64-v8a.so"
          cp libs/armeabi-v7a/libmtalk_copy_hook.so "$OUT/zygisk/armeabi-v7a.so"
          cp build/hook.dex "$OUT/hook.dex"
          printf '#!/system/bin/sh\nui_print "mTalk Copy Unlocker %s"\nchmod 644 "${0%%/*}/hook.dex"\n' "$V" > "$OUT/customize.sh"
          printf '#!/system/bin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" module.prop -d "$MODPATH"\nunzip -o "$ZIPFILE" hook.dex -d "$MODPATH"\nunzip -o "$ZIPFILE" customize.sh -d "$MODPATH"\nunzip -o "$ZIPFILE" "zygisk/*" -d "$MODPATH"\nchmod 755 "$MODPATH/customize.sh"\n"$MODPATH/customize.sh"\n' > "$OUT/META-INF/com/google/android/update-binary"
          echo "#MAGISK" > "$OUT/META-INF/com/google/android/updater-script"
          ZIP="mtalk_copy_hook_${V}.zip"
          ( cd "$OUT" && zip -r9 "../$ZIP" . )
          echo "$(wc -c < $ZIP) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk_copy_hook-${{ steps.ver.outputs.version }}
          path: mtalk_copy_hook_*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk Copy Unlocker ${{ steps.ver.outputs.version }}"
          body: |
            Zygisk module bypass copy restriction cho mTalk.
            Cai: Magisk > Modules > Install from storage > Reboot
            Debug: adb logcat -s mTalkCopyHook
          files: mtalk_copy_hook_*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
