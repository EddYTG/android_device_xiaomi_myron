- name: Download PyInstaller wheels
  run: |
    pip download pyinstaller==6.20.0 `
      --dest ./pyinstaller-wheels `
      --platform win_amd64 `
      --python-version 311 `
      --only-binary=:all:

- name: Upload artifact
  uses: actions/upload-artifact@v4
  with:
    name: pyinstaller-wheels
    path: ./pyinstaller-wheels/*.whl
