name: Build mTalk Copy Unlocker

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      NDK_VERSION: "25.2.9519653"
      BUILD_TOOLS_VERSION: "34.0.0"
      COMPILE_SDK: "34"
      DRIVE_FILE_ID: "1Ns-grNd4lKdfrv6-0Pag4r4pVTUgt00z"

    steps:

      # ── 1. Download source từ Google Drive ──────────────────────────────────
      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
              -o source.zip
          else
            curl -fsSL \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o source.zip
          fi
          echo "source.zip: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      # ── 2. Extract ──────────────────────────────────────────────────────────
      - name: Extract source
        run: |
          unzip -q source.zip
          # Detect nếu có thư mục root wrapper (vd: zygisk_mtalk/)
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          echo "=== Tree ==="
          find . -not -path './.git/*' -not -name 'source.zip' | sort | head -30

      # ── 3. Patch source ─────────────────────────────────────────────────────
      - name: Patch source
        run: |
          # Android.mk: xoa block dobby prebuilt
          sed -i '/LOCAL_MODULE.*:=.*dobby/,/PREBUILT_STATIC_LIBRARY/d' jni/Android.mk
          sed -i '/LOCAL_STATIC_LIBRARIES.*dobby/d' jni/Android.mk

          # Application.mk: bat STL va exceptions (can cho Dobby build-from-source)
          sed -i 's/^APP_STL[[:space:]]*:=.*/APP_STL       := c++_static/' jni/Application.mk
          sed -i 's/-fno-exceptions//' jni/Application.mk
          sed -i 's/-fno-rtti//'       jni/Application.mk
          grep -q '^APP_STL' jni/Application.mk || echo 'APP_STL       := c++_static' >> jni/Application.mk

          # main.cpp: xoa #include dobby.h (se duoc thay bang path tuyet doi)
          sed -i '/#include.*dobby/d' jni/main.cpp

          # main.cpp: them includes con thieu
          grep -q '<vector>'   jni/main.cpp || sed -i '/#include <jni.h>/a #include <vector>'   jni/main.cpp
          grep -q '<unistd.h>' jni/main.cpp || sed -i '/#include <jni.h>/a #include <unistd.h>' jni/main.cpp
          grep -q '<pthread.h>' jni/main.cpp || sed -i '/#include <jni.h>/a #include <pthread.h>' jni/main.cpp

          echo "=== Android.mk ==="
          cat jni/Android.mk
          echo "=== Application.mk ==="
          cat jni/Application.mk
          echo "=== main.cpp includes ==="
          grep '^#include' jni/main.cpp

      # ── 4. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 5. Android SDK ──────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build-tools
        run: |
          sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "platforms;android-${{ env.COMPILE_SDK }}"

      # ── 6. Build Dobby từ source (cache theo commit hash) ───────────────────
      - name: Cache Dobby prebuilt
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: dobby_out
          key: dobby-ndk${{ env.NDK_VERSION }}-${{ runner.os }}-v4

      - name: Build Dobby from source
        if: steps.cache-dobby.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y cmake ninja-build

          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby_src
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"

          build_dobby() {
            ABI=$1
            echo "==> Building Dobby for $ABI"
            cmake -S dobby_src -B dobby_build_${ABI} \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="${NDK_HOME}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=${ABI} \
              -DANDROID_PLATFORM=android-26 \
              -DPlugin.Android.BionicLinkerUtil=ON \
              -DCMAKE_CXX_FLAGS="-fno-exceptions -fno-rtti" \
              -DDOBBY_BUILD_SHARED=OFF \
    -DBUILD_WITH_TRAMPOLINE_ASM=OFF
            cmake --build dobby_build_${ABI} -- -j$(nproc)
            mkdir -p dobby_out/${ABI}
            cp dobby_build_${ABI}/libdobby.a dobby_out/${ABI}/
          }

          build_dobby arm64-v8a
          build_dobby armeabi-v7a

          # Copy header
          mkdir -p dobby_out/include
          cp dobby_src/include/dobby.h dobby_out/include/

          echo "=== Dobby built ==="
          ls -lh dobby_out/arm64-v8a/ dobby_out/armeabi-v7a/

      - name: Install Dobby into jni/
        run: |
          mkdir -p jni/libs/arm64-v8a jni/libs/armeabi-v7a jni/include
          cp dobby_out/arm64-v8a/libdobby.a  jni/libs/arm64-v8a/
          cp dobby_out/armeabi-v7a/libdobby.a jni/libs/armeabi-v7a/
          cp dobby_out/include/dobby.h        jni/include/

          # Them lai Android.mk block dobby (dung prebuilt vua build)
          # va them include dobby.h vao main.cpp
          cat >> jni/Android.mk << 'MKEOF'

          include $(CLEAR_VARS)
          LOCAL_MODULE             := dobby
          LOCAL_SRC_FILES          := libs/$(TARGET_ARCH_ABI)/libdobby.a
          LOCAL_EXPORT_C_INCLUDES  := $(LOCAL_PATH)/include
          include $(PREBUILT_STATIC_LIBRARY)
          MKEOF

          # Them dobby linkage vao module chinh
          sed -i '/LOCAL_MODULE.*:=.*mtalk_copy_hook/a LOCAL_STATIC_LIBRARIES := dobby' jni/Android.mk

          # Them #include "dobby.h" vao main.cpp (sau zygisk.hpp)
          sed -i '/#include "zygisk.hpp"/a #include "dobby.h"' jni/main.cpp

          echo "=== Android.mk final ==="
          cat jni/Android.mk

      # ── 7. Download zygisk.hpp ──────────────────────────────────────────────
      - name: Download zygisk.hpp
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp" \
            -o jni/zygisk.hpp
          echo "zygisk.hpp: $(wc -c < jni/zygisk.hpp) bytes"

      # ── 8. Build .so ────────────────────────────────────────────────────────
      - name: Build native Zygisk module
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_OPTIM=release \
            -j$(nproc)
          echo "=== Built libs ==="
          find libs -name "*.so" -exec ls -lh {} \;

      # ── 9. Compile Java → DEX ───────────────────────────────────────────────
      - name: Compile Java payload to DEX
        run: |
          ANDROID_JAR="${ANDROID_SDK_ROOT}/platforms/android-${{ env.COMPILE_SDK }}/android.jar"
          BT="${ANDROID_SDK_ROOT}/build-tools/${{ env.BUILD_TOOLS_VERSION }}"
          mkdir -p build/classes

          javac -source 11 -target 11 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            src/main/java/com/mtalk/copyhook/CopyHookEntry.java

          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --output build/ \
            $(find build/classes -name "*.class")

          mv build/classes.dex build/hook.dex
          echo "hook.dex: $(wc -c < build/hook.dex) bytes"

      # ── 10. Version ─────────────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      # ── 11. Package ZIP ─────────────────────────────────────────────────────
      - name: Package Magisk module ZIP
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT=staging
          mkdir -p "$OUT/zygisk" "$OUT/META-INF/com/google/android"

          sed "s/^version=.*/version=${V}/" module.prop > "$OUT/module.prop"
          cp libs/arm64-v8a/libmtalk_copy_hook.so  "$OUT/zygisk/arm64-v8a.so"
          cp libs/armeabi-v7a/libmtalk_copy_hook.so "$OUT/zygisk/armeabi-v7a.so"
          cp build/hook.dex "$OUT/hook.dex"

          cat > "$OUT/customize.sh" << CEOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          ui_print "mTalk Copy Unlocker ${V}"
          ui_print "Requires: Zygisk (Magisk 24+ or KernelSU + ZygiskNext)"
          chmod 644 "\$MODDIR/hook.dex"
          CEOF

          cat > "$OUT/META-INF/com/google/android/update-binary" << 'UEOF'
          #!/system/bin/sh
          SKIPUNZIP=1
          unzip -o "$ZIPFILE" 'module.prop'  -d "$MODPATH"
          unzip -o "$ZIPFILE" 'hook.dex'     -d "$MODPATH"
          unzip -o "$ZIPFILE" 'customize.sh' -d "$MODPATH"
          unzip -o "$ZIPFILE" 'zygisk/*'     -d "$MODPATH"
          chmod 755 "$MODPATH/customize.sh"
          "$MODPATH/customize.sh"
          UEOF

          echo "#MAGISK" > "$OUT/META-INF/com/google/android/updater-script"

          ZIP="mtalk_copy_hook_${V}.zip"
          ( cd "$OUT" && zip -r9 "../$ZIP" . )
          echo "$(wc -c < $ZIP) bytes → $ZIP"
          unzip -l "$ZIP"

      # ── 12. Upload artifact ─────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk_copy_hook-${{ steps.ver.outputs.version }}
          path: mtalk_copy_hook_*.zip
          retention-days: 30

      # ── 13. GitHub Release (tag v* only) ────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk Copy Unlocker ${{ steps.ver.outputs.version }}"
          body: |
            ## mTalk Copy Unlocker ${{ steps.ver.outputs.version }}

            Zygisk module bypass copy restriction cho mTalk (com.lgcns.newucap.demo).

            ### Hook strategy
            - **Native**: Dobby hook `getRectsForRange` @ `libflutter.so+0x7CF9D4` (Flutter 3.5.4 arm64)
            - **Java**: MethodChannel proxy `flutter/platform` + ClipboardManager monitor

            ### Yêu cầu
            - Root + Magisk 24+ (Zygisk ON) hoặc KernelSU + ZygiskNext
            - Android 8.0+ (API 26+)

            ### Cài đặt
            1. Tải `.zip` bên dưới
            2. Magisk → Modules → Install from storage → Reboot

            ### Debug
            ```
            adb logcat -s mTalkCopyHook
            ```
          files: mtalk_copy_hook_*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
