name: Download werkzeug + filelock wheels (Win10 + Python 3.11)

on:
  workflow_dispatch:

jobs:
  download-wheels:
    runs-on: windows-latest

    steps:
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download wheels
        run: |
          pip download werkzeug filelock `
            --dest wheels `
            --platform win_amd64 `
            --python-version 3.11 `
            --implementation cp `
            --abi cp311 `
            --only-binary=:all:

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: werkzeug-filelock-win-py311
          path: wheels/
          retention-days: 30
          
