name: Build mTalk Copy Unlocker (LSPosed)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      DRIVE_FILE_ID: "1qcUTD6tJFqQjgsMAAbBOt-bH9GIXNrmJ"

    steps:

      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
              -o source.zip
          else
            curl -fsSL \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o source.zip
          fi
          echo "Downloaded: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      - name: Extract source
        run: |
          unzip -q source.zip
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          echo "=== Tree ==="
          find . -not -path './.git/*' -not -name 'source.zip' | sort

      - name: Verify & fix project plugin (must be application, not library)
        run: |
          echo "=== Raw plugin lines ==="
          grep -n "android.library\|android.application\|apply plugin\|^plugins" app/build.gradle || true

          # Cover tat ca syntax variants:
          # 1. apply plugin: 'com.android.library'
          sed -i "s/apply plugin: 'com.android.library'/apply plugin: 'com.android.application'/" app/build.gradle
          # 2. apply plugin: "com.android.library"
          sed -i 's/apply plugin: "com.android.library"/apply plugin: "com.android.application"/' app/build.gradle
          # 3. id("com.android.library")  [Kotlin DSL]
          sed -i 's/id("com.android.library")/id("com.android.application")/' app/build.gradle
          # 4. id 'com.android.library'   [Groovy plugins block]
          sed -i "s/id 'com.android.library'/id 'com.android.application'/" app/build.gradle
          # 5. id("com.android.library") version "x.x.x"
          sed -i 's/id("com.android.library") version/id("com.android.application") version/' app/build.gradle

          echo "=== After patch ==="
          grep -n "android.library\|android.application\|apply plugin" app/build.gradle || true

          # Verify patch thanh cong
          if grep -q "com.android.library" app/build.gradle; then
            echo "ERROR: still has library plugin after patch — unknown syntax!"
            cat app/build.gradle
            exit 1
          fi

          # Them applicationId neu chua co (chi khi da la application)
          if ! grep -q "applicationId" app/build.gradle; then
            sed -i '/defaultConfig {/a\        applicationId "com.mtalk.copyhook"' app/build.gradle
            echo "Added applicationId"
          fi

          echo "=== app/build.gradle ===" && cat app/build.gradle

      - name: Patch build.gradle — use Maven for XposedBridge
        run: |
          sed -i "s|compileOnly files('libs/api-82.jar')|compileOnly 'de.robv.android.xposed:api:82'|g" app/build.gradle
          grep -q 'jcenter' settings.gradle || \
            sed -i '/mavenCentral()/a\            jcenter()' settings.gradle
          echo "=== app/build.gradle ===" && cat app/build.gradle

      - name: Download XposedBridge jars
        run: |
          mkdir -p app/libs
          curl -fsSL \
            "https://raw.githubusercontent.com/bywhat/XposedBridgeApi/main/XposedBridgeAPI-82.jar" \
            -o app/libs/api-82.jar
          echo "api-82.jar: $(wc -c < app/libs/api-82.jar) bytes"
          sed -i '/compileOnly.*libxposed/d' app/build.gradle
          sed -i '/compileOnly.*robv/d' app/build.gradle
          sed -i "s|compileOnly files('libs/api-82.jar')||g" app/build.gradle
          sed -i "/^dependencies {/a\    compileOnly fileTree(dir: 'libs', include: ['*.jar'])" app/build.gradle
          echo "=== app/build.gradle ===" && cat app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          # Patch MainHook.java truoc khi build
          echo "" | base64 -d | python3
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -80
          echo "=== APK files found ==="
          find . -name "*.apk" -not -path './.gradle/*' | xargs ls -lh 2>/dev/null || echo "No APK found!"

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Rename APK
        run: |
          V="${{ steps.ver.outputs.version }}"
          echo "=== Build outputs ==="
          find app/build/outputs/ | sort
          # FIX: chi tim .apk, dung ngoac de fix precedence cua find -o
          OUT=$(find app/build/outputs \( -name "*.apk" \) | grep -v "unsigned" | head -1)
          # Fallback: lay ca unsigned neu khong co signed
          if [ -z "$OUT" ]; then
            OUT=$(find app/build/outputs \( -name "*.apk" \) | head -1)
          fi
          if [ -z "$OUT" ]; then
            echo "ERROR: no APK found in app/build/outputs — build failed!"
            exit 1
          fi
          echo "Using: $OUT"
          echo "Size: $(wc -c < "$OUT") bytes"
          # Verify day la APK that (co PK header = 50 4b)
          MAGIC=$(xxd -l 2 "$OUT" | awk '{print $2}')
          if [ "$MAGIC" != "504b" ]; then
            echo "ERROR: file is not a valid ZIP/APK (magic=$MAGIC) — got AAR or garbage!"
            exit 1
          fi
          cp "$OUT" "mtalk_copy_hook_lsposed_${V}.apk"
          echo "OK: mtalk_copy_hook_lsposed_${V}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk_copy_hook_lsposed-${{ steps.ver.outputs.version }}
          path: mtalk_copy_hook_lsposed_*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk Copy Unlocker LSPosed ${{ steps.ver.outputs.version }}"
          body: |
            ## mTalk Copy Unlocker — LSPosed Module ${{ steps.ver.outputs.version }}

            Hook InputConnectionAdaptor để bypass copy restriction trong mTalk.

            ### Yêu cầu
            - LSPosed (Magisk hoặc KernelSU)
            - mTalk v1.3.2 (com.lgcns.newucap.demo)

            ### Cài đặt
            1. Cài APK
            2. LSPosed Manager → Modules → bật **mTalk Copy Unlocker**
            3. Scope: chọn **mTalk**
            4. Reboot

            ### Dùng
            Vào Edit Message → Select All → tự động copy sau 100ms

            ### Debug
            ```
            adb logcat -s XposedBridge | grep mTalkCopyHook
            ```
          files: mtalk_copy_hook_lsposed_*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
