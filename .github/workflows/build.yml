name: Build mTalk Reader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      DRIVE_FILE_ID: "1P_RiNaJy81R9sr9Ndshclr8RltySRWLQ"

    steps:

      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt \
              "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
              -o source.zip
          else
            curl -fsSL \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
              -o source.zip
          fi
          echo "Downloaded: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      - name: Extract source
        run: |
          unzip -q source.zip
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          echo "=== Tree ==="
          find . -not -path './.git/*' -not -name 'source.zip' | sort | head -30

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon
          find . -name "*.apk" | xargs ls -lh

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Rename APK
        run: |
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "mtalk_reader_${V}.apk"
          echo "APK: $(wc -c < mtalk_reader_${V}.apk) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk-reader-${{ steps.ver.outputs.version }}
          path: mtalk_reader_*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk Reader ${{ steps.ver.outputs.version }}"
          body: |
            ## mTalk Reader ${{ steps.ver.outputs.version }}

            App đọc text từ mTalk qua Accessibility Service — không cần root.

            ### Cài đặt
            1. Cài APK
            2. Mở app → nhấn **Mở Settings**
            3. Tìm **mTalk Reader** → bật
            4. Mở mTalk, xem tin nhắn muốn copy
            5. Quay lại mTalk Reader → nhấn **Refresh**
            6. Tap vào text → tự động copy vào clipboard
          files: mtalk_reader_*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
