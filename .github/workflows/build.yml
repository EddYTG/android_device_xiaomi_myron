name: Build mTalk 10KB Bypass

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      NDK_VERSION: "25.2.9519653"
      DRIVE_FILE_ID: "1GDbkySpkBaXJQ3JJSKGwQbQk6vUT2Tgv"

    steps:

      - name: Download source from Google Drive
        run: |
          FILE_ID="${{ env.DRIVE_FILE_ID }}"
          curl -fsSc /tmp/gc.txt "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o /tmp/check.html
          CONFIRM=$(grep -oP 'confirm=\K[^&"]+' /tmp/check.html | head -1)
          if [ -n "$CONFIRM" ]; then
            curl -fsSL -b /tmp/gc.txt "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" -o source.zip
          else
            curl -fsSL "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o source.zip
          fi
          echo "Downloaded: $(wc -c < source.zip) bytes"
          unzip -l source.zip | head -20

      - name: Extract source
        run: |
          unzip -q source.zip
          ROOT=$(unzip -l source.zip | awk 'NR==4{print $4}' | cut -d/ -f1)
          if [ -d "$ROOT" ] && [ "$ROOT" != "." ] && [ -n "$ROOT" ]; then
            shopt -s dotglob && mv "$ROOT"/* . && rmdir "$ROOT" 2>/dev/null || true
          fi
          find . -not -path './.git/*' -not -name 'source.zip' | sort | head -30

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" 2>&1 | tail -5
          echo "NDK installed: $ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

      - name: Download zygisk.hpp
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/topjohnwu/zygisk-api/v4.1.0/zygisk.hpp" \
            -o jni/zygisk.hpp
          echo "zygisk.hpp: $(wc -c < jni/zygisk.hpp) bytes"

      - name: Build native Zygisk module
        run: |
          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}"
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_OPTIM=release \
            -j$(nproc) V=0
          find libs -name "*.so" -exec ls -lh {} \;

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Package Magisk module ZIP
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT=staging
          mkdir -p "$OUT/zygisk" "$OUT/META-INF/com/google/android"

          cp module.prop                        "$OUT/module.prop"
          cp libs/arm64-v8a/libmtalk_10kb.so    "$OUT/zygisk/arm64-v8a.so"
          cp libs/armeabi-v7a/libmtalk_10kb.so  "$OUT/zygisk/armeabi-v7a.so"

          cat > "$OUT/customize.sh" << 'SH'
#!/system/bin/sh
ui_print "- mTalk 10KB Bypass"
ui_print "- Patch: libapp.so+0x992098 (b.ge -> nop)"
ui_print "- Target: com.lgcns.newucap.demo v1.3.2"
SH

          cat > "$OUT/META-INF/com/google/android/update-binary" << 'SH'
#!/system/bin/sh
SKIPUNZIP=1
unzip -o "$ZIPFILE" module.prop  -d "$MODPATH"
unzip -o "$ZIPFILE" customize.sh -d "$MODPATH"
unzip -o "$ZIPFILE" 'zygisk/*'   -d "$MODPATH"
chmod 755 "$MODPATH/customize.sh"
. "$MODPATH/customize.sh"
SH

          echo "#MAGISK" > "$OUT/META-INF/com/google/android/updater-script"

          ZIP="mtalk_10kb_bypass_${V}.zip"
          ( cd "$OUT" && zip -r9 "../$ZIP" . )
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "Built: $ZIP ($(wc -c < $ZIP) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtalk_10kb_bypass-${{ steps.ver.outputs.version }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "mTalk 10KB Bypass ${{ steps.ver.outputs.version }}"
          body: |
            Bo gioi han "Please keep your message to 10KB or less"
            Patch: libapp.so+0x992098 (b.ge -> nop)

            Install: Magisk -> Modules -> Install from storage -> Reboot
            Debug: adb logcat | grep mTalk10KB
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
