name: CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      DRIVE_URL: ${{ secrets.DRIVE_URL }}
      BUILD_CONFIG: Release
      SOLUTION: IQ.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FIX: python setup version stable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install gdown==5.2.0

      # FIX: download ổn định hơn gdown module call
      - name: Download Drive file
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $out = "$env:GITHUB_WORKSPACE\input.zip"

          gdown --fuzzy "$env:DRIVE_URL" -O $out

          if (!(Test-Path $out)) {
            throw "Download failed"
          }

      # FIX: ZIP validation chắc hơn
      - name: Validate ZIP
        shell: powershell
        run: |
          $file = "$env:GITHUB_WORKSPACE\input.zip"
          $bytes = Get-Content $file -Encoding Byte -TotalCount 4

          if ($bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4B) {
            throw "Invalid ZIP file (not PK header)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # FIX: restore bằng nuget trước msbuild
      - name: Restore NuGet
        shell: powershell
        run: |
          nuget restore $env:SOLUTION

      - name: Build Solution
        shell: powershell
        run: |
          msbuild $env:SOLUTION `
            /p:Configuration=$env:BUILD_CONFIG `
            /m

      # Obfuscation step (safe check)
      - name: Obfuscate
        shell: powershell
        run: |
          $inputExe = "bin\$env:BUILD_CONFIG\IQ.exe"
          $outDir = "obfuscated"

          if (!(Test-Path $inputExe)) {
            throw "Missing build output EXE"
          }

          mkdir $outDir -Force | Out-Null

          # nếu bạn dùng obfuscar config
          obfuscar obfuscar.xml

      # Package
      - name: Package output
        shell: powershell
        run: |
          $zip = "final_build.zip"

          Compress-Archive -Path obfuscated\* -DestinationPath $zip -Force

          $hash = Get-FileHash $zip -Algorithm SHA256
          $hash.Hash | Out-File "final_build.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            final_build.zip
            final_build.sha256
