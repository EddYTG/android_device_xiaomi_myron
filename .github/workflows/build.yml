name: OrangeFox 14.1 — Xiaomi myron (SM8850)

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: "Device tree URL"
        required: true
        default: "https://github.com/hackpupg001-a11y/android_device_xiaomi_myron"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "fox_14.1"
      DEVICE_PATH:
        description: "Device path under device/"
        required: true
        default: "xiaomi/myron"
      DEVICE_NAME:
        description: "Device codename"
        required: true
        default: "myron"
      BUILD_PARTITION:
        description: "Build partition (recovery)"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # ──────────────────────────────────────────────────────────────────────────
    - name: Compute build metadata
      run: |
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo "Device tree url   : ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device path       : ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device name       : ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build target      : ${{ github.event.inputs.BUILD_PARTITION }}.img"
          echo "Build date        : $(date)"
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

    # ──────────────────────────────────────────────────────────────────────────
    - name: Cleanup runner
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    # ──────────────────────────────────────────────────────────────────────────
    - name: Setup zram swap
      run: |
        sudo apt-get install -y linux-modules-extra-$(uname -r) zram-tools
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    # ──────────────────────────────────────────────────────────────────────────
    - name: Setup build environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update -y && sudo apt-get upgrade -y
        sudo apt-get install -y repo git wget curl python3
        git config --global user.name  "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    # ──────────────────────────────────────────────────────────────────────────
    - name: Sync TWRP base manifest
      run: |
        repo init -u https://github.com/nebrassy/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
        (while true; do echo "Syncing TWRP base..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        kill $TIP_PID || true

    # ──────────────────────────────────────────────────────────────────────────
    - name: Sync OrangeFox 14.1 source
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        WORKINGDIR=$(pwd)
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path "$WORKINGDIR"
        cd "$WORKINGDIR"

    # ──────────────────────────────────────────────────────────────────────────
    - name: Clone device tree
      run: |
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "device/${{ github.event.inputs.DEVICE_PATH }}"

    # ──────────────────────────────────────────────────────────────────────────
    - name: Verify device tree
      run: |
        echo "=== Verifying device tree ==="
        ls "device/${{ github.event.inputs.DEVICE_PATH }}/"
        echo "=== AndroidProducts.mk ==="
        cat "device/${{ github.event.inputs.DEVICE_PATH }}/AndroidProducts.mk"
        echo "=== twrp_${{ github.event.inputs.DEVICE_NAME }}.mk ==="
        cat "device/${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk"

    # ──────────────────────────────────────────────────────────────────────────
    - name: Apply OrangeFox recovery patches
      run: |
        WORKINGDIR=$(pwd)
        PATCH_DIR="$WORKINGDIR/device/${{ github.event.inputs.DEVICE_PATH }}/patches"
        if [ -d "$PATCH_DIR" ] && ls "$PATCH_DIR"/*.patch &>/dev/null; then
          cd "$WORKINGDIR/bootable/recovery"
          for patch in "$PATCH_DIR"/*.patch; do
            echo "Applying patch: $patch"
            git apply "$patch" || echo "WARN: patch $patch failed (may already be applied)"
          done
          cd "$WORKINGDIR"
        else
          echo "No patches directory found — skipping"
        fi
        # libmicrohttpd for OrangeFox HTTP server
        git clone https://github.com/adontoo/android_external_libmicrohttpd \
          -b ofox-14.1 external/libmicrohttpd 2>/dev/null || true
        # bionic fix for OrangeFox 14.1
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic 2>/dev/null || true

    # ──────────────────────────────────────────────────────────────────────────
    - name: Generate build info file
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Changelog:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "${LAST_TAG}..HEAD" --pretty=format:"- %h %an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h %an: %s" >> INFO.txt
        fi
        cat INFO.txt

    # ──────────────────────────────────────────────────────────────────────────
    - name: Build OrangeFox Recovery
      run: |
        # ── vendorsetup.sh exports all FOX_ / OF_ vars automatically ─────────
        # FOX_BUILD_DEVICE must be set before source/lunch
        export FOX_BUILD_DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
        export LC_ALL="C"
        export ALLOW_MISSING_DEPENDENCIES=true

        # ccache
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1

        # ── source envsetup — vendorsetup.sh is auto-sourced here ─────────────
        source build/envsetup.sh

        # ── OrangeFox 14.1 + dedicated recovery: ap2a-eng + recoveryimage ──────
        #    Confirmed by: koaaN/infiniti, adontoo/sm8750 repos
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng

        # ── Build ─────────────────────────────────────────────────────────────
        (while true; do echo "$(date +%T) Building OrangeFox..."; free -h; sleep 15; done) &
        TIP_PID=$!
        mka adbd ${{ github.event.inputs.BUILD_PARTITION }}image
        kill $TIP_PID

        # ── Rename outputs ────────────────────────────────────────────────────
        OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        SUFFIX="${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}"

        if [ -f "$OUT_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" ]; then
          mv "$OUT_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" \
             "$OUT_DIR/OrangeFox-14.1-${SUFFIX}.img"
          echo "IMG renamed: OrangeFox-14.1-${SUFFIX}.img"
        fi

        ZIP_SRC=$(ls "$OUT_DIR"/OrangeFox*.zip 2>/dev/null | head -1)
        if [ -n "$ZIP_SRC" ]; then
          mv "$ZIP_SRC" "$OUT_DIR/OrangeFox-14.1-${SUFFIX}.zip"
          echo "ZIP renamed: OrangeFox-14.1-${SUFFIX}.zip"
        else
          echo "WARNING: No OrangeFox ZIP found in $OUT_DIR"
          ls "$OUT_DIR"/ || true
        fi

    # ──────────────────────────────────────────────────────────────────────────
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-14.1-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-14.1-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.zip
        name: OrangeFox-14.1-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
