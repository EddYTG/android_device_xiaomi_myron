name: Build Nuitka Wheel

on:
  push:
    branches: [main]
  workflow_dispatch:  # chạy thủ công

jobs:
  build:
    runs-on: windows-latest  # build trên Windows → đúng platform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install wheel setuptools build

      - name: Extract and build wheel
        run: |
          tar -xzf nuitka-4.0.8.tar.gz
          cd nuitka-4.0.8
          python -m build --wheel --no-isolation

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-wheel
          path: nuitka-4.0.8/dist/*.whl
